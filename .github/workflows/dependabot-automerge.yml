# Auto-merge patch/minor Dependabot PRs once CI is green.
# OFF until the repository variable AUTO_MERGE_DEPENDABOT is set to "true". Set it only after the repo is public
# and a ruleset requires the CI checks: without a required check, --auto would merge immediately.
name: Dependabot auto-merge
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && vars.AUTO_MERGE_DEPENDABOT == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
