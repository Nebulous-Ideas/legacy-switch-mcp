# Publish to PyPI when a GitHub release is published. Uses PyPI trusted publishing (OIDC): no token is stored anywhere.
# One-time setup on pypi.org: add a "pending publisher" for this repo, workflow publish.yml, environment "pypi".
name: Publish
on:
  release:
    types: [published]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
