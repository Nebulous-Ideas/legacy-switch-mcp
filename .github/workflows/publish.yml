# Publish to PyPI when a GitHub release is published, and attach an SBOM to that release.
# PyPI uses trusted publishing (OIDC): no token is stored anywhere, and the action attaches signed provenance attestations.
# The built files are also signed with Sigstore and attached to the release (Scorecard Signed-Releases).
# One-time setup on pypi.org: a (pending) publisher for this repo, workflow publish.yml, environment "pypi".
name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  gate:
    # Dynamic analysis before anything is published: the tests under Python's development mode with warnings as errors,
    # and the Hypothesis property tests (parser fuzzing) at a much higher example count than in everyday CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -W error
        env:
          PYTHONDEVMODE: "1"
          HYPOTHESIS_PROFILE: release
  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  sign:
    # Keyless Sigstore signatures (*.sigstore.json) for the exact files published to PyPI, attached to the release.
    # Verify with: sigstore verify github --repository Nebulous-Ideas/legacy-switch-mcp <file>
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uvx --from sigstore==4.5.0 sigstore sign dist/*
      - run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
  sbom:
    # CycloneDX SBOM of the locked dependency set (hash-pinned in uv.lock), attached to the release.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv export --frozen --no-emit-project --format cyclonedx1.5 -o sbom.cdx.json
      - run: gh release upload "$TAG" sbom.cdx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
