# Publish server.json to the official MCP Registry using GitHub OIDC (no token stored anywhere).
# The registry grants io.github.<org>/* to workflows running in that org's repositories.
# Runs after the PyPI publish succeeds (the registry checks the package and its mcp-name marker on PyPI), or by hand.
name: MCP Registry
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.9
      # sha256 of mcp-publisher_linux_amd64.tar.gz from the release's registry_1.8.9_checksums.txt
      PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher (checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
