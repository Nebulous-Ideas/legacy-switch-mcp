[project]
name = "switch-mcp"
version = "0.1.0"
description = "Read-only MCP server for Cameo-built smart switches (D-Link DGS-1100, USRobotics 7724): UDP discovery plus web-page reads"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
switch-mcp = "switch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
