<script language=JavaScript>
function enable_all()
{
 for (var i=0; i<24; i++)
 {
  document.vlan.vcb[i].checked = true;
 }
}
function disable_all()
{
 for (var i=0; i<24; i++)
 {
  document.vlan.vcb[i].checked = false;
 }
}
function apply_chk()
{
var f=document.vlan;
 for (var i=0; i<24; i++)
 {
  if (f.vcb[i].checked == true)
  {
   f.submit();
   return;
  }
 }
 alert('At least one port must be selected.');
}
</script>
